bundle:
  name: design-md-behavior
  version: 1.0.0
  description: >
    DESIGN.md format integration layer. Registers three agents that generate,
    import, and validate Google DESIGN.md files on top of design-intelligence.

    PEER DEPENDENCY: amplifier-bundle-design-intelligence must already be
    composed in the bundle that includes this behavior. Use this partial when
    you already have design-intelligence configured — it adds only the
    DESIGN.md layer with zero transitive cost to foundation or
    design-intelligence. If you need a self-contained batteries-included
    install that pulls everything in automatically, include the full bundle.md
    instead.

agents:
  include:
    - design-md:design-md-generator
    - design-md:design-md-importer
    - design-md:design-md-reviewer

context:
  include:
    - design-md:context/design-md-awareness.md
